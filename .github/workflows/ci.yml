name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test the Node build
        shell: bash
        run: |
          node dist/stdinman.js --help
          node dist/stdinman.js --version
          node dist/stdinman.js config path

      - name: Build the standalone binary
        run: bun run compile

      - name: Smoke test the binary
        shell: bash
        run: |
          bin=dist/bin/stdinman
          [ "$RUNNER_OS" = Windows ] && bin=dist/bin/stdinman.exe
          "$bin" --version
          # doctor fails without a token; only the DAVE check matters here.
          "$bin" doctor -c does-not-exist.toml | tee doctor.txt || true
          grep -E "ok +DAVE library" doctor.txt

      - name: Check the npm package contents
        if: runner.os == 'Linux'
        run: npm pack --dry-run
